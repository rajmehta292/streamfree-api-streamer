<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFree Multi-View - Watch Multiple Sports Simultaneously</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .multiview-layout-bar {
      max-width: 1400px;
      margin: 16px auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .layout-picker {
      display: flex;
      gap: 8px;
    }
    .layout-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .layout-btn.active, .layout-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .multiview-grid {
      max-width: 1400px;
      margin: 0 auto 32px;
      padding: 0 24px;
      display: grid;
      gap: 16px;
      flex: 1;
      min-height: 600px;
    }
    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .multiview-tile {
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      min-height: 320px;
    }
    .tile-header {
      background: rgba(18, 20, 29, 0.9);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }
    .tile-header select {
      flex: 1;
      background: var(--bg-card);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      outline: none;
    }
    .tile-body {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }
    .tile-body iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <a href="/" class="brand" style="text-decoration: none;">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
          <div class="brand-title">
            STREAMFREE
            <span class="brand-badge">Multi-View</span>
          </div>
        </a>
      </div>

      <div class="nav-actions">
        <a href="/" class="btn btn-outline">
          &larr; Back to Single View
        </a>
        <a href="/docs" target="_blank" class="btn btn-outline">
          API Docs
        </a>
      </div>
    </div>
  </header>

  <div class="multiview-layout-bar">
    <div style="font-size: 14px; color: var(--text-muted);">
      Watch multiple games at once with synchronized audio and layout presets:
    </div>

    <div class="layout-picker">
      <button class="layout-btn" data-layout="1">1 Screen</button>
      <button class="layout-btn" data-layout="2">2 Split</button>
      <button class="layout-btn active" data-layout="4">4 Quad (2x2)</button>
    </div>
  </div>

  <main class="multiview-grid grid-4" id="multiview-container">
    <!-- Tiles dynamically injected -->
  </main>

  <script src="/js/multiview.js"></script>
</body>
</html>
